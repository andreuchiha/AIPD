<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>Phishing Email Detector</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container-fluid h-100">
        <h1 class="text-center mb-3">Phishing Email Detector</h1>
        
        <!-- Loading Overlay -->
        <div id="loadingOverlay" class="loading-overlay">
            <div class="loading-spinner">
                <div class="spinner-border text-light" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <div class="loading-text mt-2">Analyzing Email...</div>
            </div>
        </div>
        
        <div class="row h-100">
            <!-- Left side: Input -->
            <div class="col-md-6">
                <div class="card h-100">
                    <div class="card-body d-flex flex-column">
                        <div class="mb-2">
                            <label for="modelType" class="form-label">Model Type:</label>
                            <select id="modelType" class="form-select">
                                <option value="nb">Naive Bayes (Most Accurate)</option>
                                <option value="rf">Random Forest (Faster)</option>
                                <option value="lr">Logistic Regression (Balanced)</option>
                                <option value="gb">Gradient Boosting (Simple)</option>
                            </select>
                        </div>
                        
                        <div class="mb-2">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" id="limeToggle" checked>
                                <label class="form-check-label" for="limeToggle">Show Explanations</label>
                            </div>
                        </div>
                        
                        <div class="input-container flex-grow-1">
                            <label for="emailText" class="form-label">Email Text:</label>
                            <textarea id="emailText" class="form-control" 
                                    placeholder="Paste your email text here..."></textarea>
                        </div>
                        
                        <div class="button-container mt-2">
                            <button id="analyzeBtn" class="btn btn-primary w-100">Analyze Email</button>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Right side: Analysis -->
            <div class="col-md-6">
                <div class="card h-100">
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title">Analysis Results</h5>
                        
                        <!-- Confidence Chart -->
                        <div class="confidence-chart mb-3">
                            <div class="chart-label">Confidence Level</div>
                            <div class="chart-container">
                                <canvas id="confidenceChart"></canvas>
                            </div>
                        </div>
                        
                        <!-- Verdict -->
                        <div id="verdict" class="alert mb-3"></div>
                        
                        <!-- Highlighted Text Box -->
                        <div class="explanation-section flex-grow-1">
                            <div class="section-header">
                                <h6 class="mb-0">Highlighted Indicators:</h6>
                                <div class="legend">
                                    <span class="legend-item">
                                        <span class="legend-color" style="background-color: #ffc107;"></span>
                                        URGENCY
                                    </span>
                                    <span class="legend-item">
                                        <span class="legend-color" style="background-color: #6f42c1;"></span>
                                        LIME
                                    </span>
                                </div>
                            </div>
                            <div id="highlightedText" class="highlighted-container"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
